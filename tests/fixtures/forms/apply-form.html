<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Software Engineer - Apply</title></head>
<body>
  <h1>Apply: Software Engineer</h1>
  <form action="/apply" method="post">
    <input type="hidden" name="csrf" value="abc123">

    <label for="name">Full name</label>
    <input id="name" name="applicant_name" type="text" required>

    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" required>

    <label for="phone">Contact number</label>
    <input id="phone" name="phone" type="tel">

    <label for="li">LinkedIn profile</label>
    <input id="li" name="linkedin" type="url" placeholder="https://linkedin.com/in/...">

    <label for="role">Most recent role</label>
    <input id="role" name="recent_role" type="text">

    <label for="auth">Work authorization</label>
    <select id="auth" name="work_auth">
      <option value="">Please select</option>
      <option>Authorized to work in Hong Kong</option>
      <option>Require visa sponsorship</option>
      <option>Prefer not to say</option>
    </select>

    <label for="why">Why do you want this role?</label>
    <textarea id="why" name="why_role" maxlength="200"></textarea>

    <label for="extra">Anything else you'd like us to know?</label>
    <textarea id="extra" name="extra_info" maxlength="300"></textarea>

    <fieldset>
      <legend>Voluntary Equal Opportunity Disclosure</legend>

      <label for="gender">Gender</label>
      <select id="gender" name="eeo_gender">
        <option value="">Select</option><option>Male</option><option>Female</option><option>Non-binary</option><option>Prefer not to say</option>
      </select>

      <label for="ethnicity">Race / Ethnicity</label>
      <select id="ethnicity" name="eeo_race">
        <option value="">Select</option><option>Asian</option><option>White</option><option>Prefer not to say</option>
      </select>

      <label for="dob">Date of birth</label>
      <input id="dob" name="dob" type="text" placeholder="DD/MM/YYYY">
    </fieldset>

    <input type="submit" value="Submit application">
  </form>
</body>
</html>
